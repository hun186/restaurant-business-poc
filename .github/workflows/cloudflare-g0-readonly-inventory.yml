name: Cloudflare G0 Worker exposure inventory (manual read-only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'CHECK_G0_WORKERS_DEV_ONLY (Scripts Read) or CHECK_G0_READONLY (full; Zone/Routes Read)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: restaurant-business-cloudflare-g0-readonly-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.confirm == 'CHECK_G0_READONLY' || inputs.confirm == 'CHECK_G0_WORKERS_DEV_ONLY') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: cloudflare-g0-readonly
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fail closed before running token-bearing code
        run: node tools/cloudflare-hosted-probe-preflight.mjs
      - name: Query Cloudflare metadata using read-only token, never deploy
        shell: bash
        env:
          G0_READONLY_CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_G0_READONLY_TOKEN }}
        run: |
          set -euo pipefail
          case "$G0_READONLY_CONFIRM" in
            CHECK_G0_WORKERS_DEV_ONLY)
              node tools/cloudflare-g0-remote-inventory.mjs inspect-entrypoints ;;
            CHECK_G0_READONLY)
              node tools/cloudflare-g0-remote-inventory.mjs inspect ;;
            *) exit 1 ;;
          esac
          echo 'G0_INVENTORY_COLLECTED_NOT_RELEASE_CERTIFIED'
