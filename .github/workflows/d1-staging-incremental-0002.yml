name: D1 staging incremental 0002 indexes (manual only)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'CHECK_STAGING_0002 is read-only; APPLY_STAGING_0002 alters staging indexes only'
        required: true
        type: choice
        default: CHECK_STAGING_0002
        options:
          - CHECK_STAGING_0002
          - APPLY_STAGING_0002
      confirm:
        description: 'Enter the exact selected action (never for production)'
        required: true
        type: string

permissions:
  contents: read

# Share concurrency with the original empty-DB migration workflow.
concurrency:
  group: restaurant-business-d1-staging-migrations
  cancel-in-progress: false

jobs:
  verify-or-apply-staging-0002:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((inputs.action == 'CHECK_STAGING_0002' && inputs.confirm == 'CHECK_STAGING_0002') ||
           (inputs.action == 'APPLY_STAGING_0002' && inputs.confirm == 'APPLY_STAGING_0002')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: d1-staging
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fail closed before npm/npx (offline Hosted probe preflight)
        run: node tools/cloudflare-hosted-probe-preflight.mjs
      - name: Validate staging-only migration inventory and account
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/cloudflare-staging-0002.mjs config
      - name: Install fixed Wrangler without cloud credentials in scope
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4.152.0
      - name: Read-only preflight on existing staging D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing staging-only Cloudflare secrets"
            exit 1
          fi
          node tools/cloudflare-staging-0002.mjs config
          snapshot="$RUNNER_TEMP/d1-staging-0002-before"
          mkdir -p "$snapshot"
          query() {
            npx --no-install wrangler d1 execute STAGING_DB --remote --json --config wrangler.preview-migrations.jsonc --command "$2" > "$snapshot/$1.json"
          }
          query ledger "SELECT name FROM d1_migrations ORDER BY name;"
          query indexes "SELECT name,sql FROM sqlite_master WHERE type='index' AND name LIKE 'idx_login_attempts_%' ORDER BY name;"
          query owners "SELECT id,username,role,active FROM users ORDER BY id;"
          query contract "SELECT contract_version FROM cloud_schema_contract WHERE id=1;"
          query fk "PRAGMA foreign_key_check;"
          query tables "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name <> '_cf_KV' ORDER BY name;"
          node tools/cloudflare-staging-0002.mjs preflight "$snapshot"
          echo 'Read-only existing staging D1 v3 preflight verified; Owner preserved.'
      - name: List pending migrations (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 migrations list STAGING_DB --remote --config wrangler.preview-migrations.jsonc
      - name: Apply ONLY pending staging 0002 after strict ledger preflight
        if: ${{ inputs.action == 'APPLY_STAGING_0002' && inputs.confirm == 'APPLY_STAGING_0002' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/cloudflare-staging-0002.mjs preflight "$RUNNER_TEMP/d1-staging-0002-before"
          npx --no-install wrangler d1 migrations apply STAGING_DB --remote --config wrangler.preview-migrations.jsonc
      - name: Read-only postflight after applying indexes
        if: ${{ inputs.action == 'APPLY_STAGING_0002' && inputs.confirm == 'APPLY_STAGING_0002' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          snapshot="$RUNNER_TEMP/d1-staging-0002-after"
          mkdir -p "$snapshot"
          query() {
            npx --no-install wrangler d1 execute STAGING_DB --remote --json --config wrangler.preview-migrations.jsonc --command "$2" > "$snapshot/$1.json"
          }
          query ledger "SELECT name FROM d1_migrations ORDER BY name;"
          query indexes "SELECT name,sql FROM sqlite_master WHERE type='index' AND name LIKE 'idx_login_attempts_%' ORDER BY name;"
          query owners "SELECT id,username,role,active FROM users ORDER BY id;"
          query contract "SELECT contract_version FROM cloud_schema_contract WHERE id=1;"
          query fk "PRAGMA foreign_key_check;"
          query tables "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name <> '_cf_KV' ORDER BY name;"
          node tools/cloudflare-staging-0002.mjs postflight "$RUNNER_TEMP/d1-staging-0002-before" "$snapshot"
          echo 'STAGING_0002_APPLIED_VERIFIED; production D1 untouched and login endpoints disabled.'
