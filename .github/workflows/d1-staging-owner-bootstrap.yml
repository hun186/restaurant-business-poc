name: D1 staging owner bootstrap (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE_STAGING_OWNER_ONCE (never for production)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: restaurant-business-d1-staging-owner-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-staging-owner:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'CREATE_STAGING_OWNER_ONCE' }}
    runs-on: ubuntu-24.04
    environment: d1-staging
    timeout-minutes: 15
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_OWNER_PASSWORD: ${{ secrets.STAGING_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate staging-only target and ephemeral password availability
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" || -z "${STAGING_OWNER_PASSWORD}" ]]; then
            echo "::error::Missing D1 staging credentials or STAGING_OWNER_PASSWORD environment secret"
            exit 1
          fi
          node tools/check-cloudflare-staging.mjs config
      - name: Install fixed Wrangler version
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4.152.0
      - name: Read-only check pristine staging D1 and schema marker
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute STAGING_DB --remote --json --config wrangler.preview-migrations.jsonc --command "SELECT (SELECT contract_version FROM cloud_schema_contract WHERE id=1) AS contract_version, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM sessions) AS sessions, (SELECT COUNT(*) FROM login_attempts) AS login_attempts, (SELECT COUNT(*) FROM audit_logs) AS audit_logs, (SELECT COUNT(*) FROM locations) AS locations, (SELECT COUNT(*) FROM stock_moves) AS stock_moves, (SELECT COUNT(*) FROM purchase_orders) AS purchase_orders;" > "$RUNNER_TEMP/staging-owner-preflight.json"
          node tools/cloudflare-staging-owner.mjs preflight "$RUNNER_TEMP/staging-owner-preflight.json"
      - name: One-time bootstrap in staging only
        shell: bash
        run: |
          set -euo pipefail
          sql="$RUNNER_TEMP/staging-owner-once.sql"
          trap 'rm -f "$sql"' EXIT
          node tools/cloudflare-staging-owner.mjs write-sql "$sql"
          npx --no-install wrangler d1 execute STAGING_DB --remote --config wrangler.preview-migrations.jsonc --file "$sql" --yes
      - name: Read-only verify exactly one active staging owner and no sessions
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute STAGING_DB --remote --json --config wrangler.preview-migrations.jsonc --command "SELECT (SELECT contract_version FROM cloud_schema_contract WHERE id=1) AS contract_version, (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM users WHERE role='owner' AND username='owner' AND active=1) AS owners, (SELECT COUNT(*) FROM sessions) AS sessions;" > "$RUNNER_TEMP/staging-owner-postflight.json"
          npx --no-install wrangler d1 execute STAGING_DB --remote --json --config wrangler.preview-migrations.jsonc --command "PRAGMA foreign_key_check;" > "$RUNNER_TEMP/staging-owner-foreign-keys.json"
          node tools/cloudflare-staging-owner.mjs verify "$RUNNER_TEMP/staging-owner-postflight.json" "$RUNNER_TEMP/staging-owner-foreign-keys.json"
          echo 'Staging-only owner provisioning completed; NO login endpoint enabled and production D1 untouched.'
