name: G6 stock v4 disposable D1 binding inventory (manual GET-only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        required: true
        type: string
        description: 'Type CHECK_G6_BINDINGS_READONLY; read-only, no D1 SQL or restore'

permissions:
  contents: read

concurrency:
  group: restaurant-business-g6-binding-readonly
  cancel-in-progress: false

jobs:
  inventory:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'CHECK_G6_BINDINGS_READONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: d1-recovery-drill-binding-readonly
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify closed workflow and dependency SHA256 inventory without credentials
        run: node tools/cloudflare-hosted-probe-preflight.mjs
      - name: Inventory all Worker versions and Pages projects (GET-only)
        env:
          G6_BINDINGS_READ_CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_G5_BINDINGS_READ_TOKEN }}
        run: node tools/cloudflare-g6-binding-inventory.mjs inspect
