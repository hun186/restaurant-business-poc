name: G6 stock v4 isolated D1 migration stage state (GET/SELECT only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CHECK_G6_STAGE_READONLY; diagnose only, never run a migration or retry'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: restaurant-business-g6-v4-stage-readonly
  cancel-in-progress: false

jobs:
  stage-readonly:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'CHECK_G6_STAGE_READONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: d1-recovery-drill-readonly
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check reviewed SHA256 allowlist before mounting any credentials
        run: node tools/cloudflare-hosted-probe-preflight.mjs
      - name: Classify exact G6 synthetic migration stage, no write access
        env:
          G6_STAGE_READONLY_CONFIRM: ${{ inputs.confirm }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_DRILL_READ_TOKEN }}
        run: node tools/cloudflare-stock-v4-g6-stage-readonly.mjs inspect
